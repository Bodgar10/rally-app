<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RALLY" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="rally-mobile-web">
      /* Fondo del lienzo del navegador (rebotes de scroll, área bajo el notch) */
      html { background-color: #0B0B0D; }
      /* Sin resaltado gris al tocar: comportamiento de app, no de página */
      html { -webkit-tap-highlight-color: transparent; }
      /* El rebote/pull-to-refresh no debe propagarse al documento */
      html, body { overscroll-behavior: none; }
      /* Los ScrollView internos ya gestionan el scroll: el documento nunca hace pan */
      body { touch-action: pan-x pan-y; }
      /* iOS infla el texto en landscape si no se fija */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
